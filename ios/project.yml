name: Operator
options:
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
packages:
  OperatorCore:
    path: OperatorCore
schemes:
  OperatorApp:
    build:
      targets:
        OperatorApp: all
        OperatorAppTests: [test]
    test:
      targets:
        - OperatorAppTests
targets:
  OperatorApp:
    type: application
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: OperatorApp/Sources
    resources:
      - path: OperatorApp/Assets.xcassets
      - path: OperatorApp/Resources/connections/handoff/android-handoff-catalog.json
      - path: build/native-node/runtime
        type: folder
    dependencies:
      # The wacli WhatsApp archive is deliberately NOT listed here. It exists
      # only as an arm64-simulator slice, so an unconditional dependency breaks
      # every device build. It is linked for the simulator through
      # OTHER_LDFLAGS[sdk=iphonesimulator*] below, and stubbed for device by
      # capabilities/whatsapp/native/WacliBridgeUnavailable.c.
      - framework: build/native-node/NodeMobile.xcframework
        embed: true
      - package: OperatorCore
      - target: OperatorWidget
        embed: true
      - sdk: AVFAudio.framework
      - sdk: CoreLocation.framework
      - sdk: EventKit.framework
      - sdk: MessageUI.framework
      - sdk: MapKit.framework
      - sdk: CoreFoundation.framework
      - sdk: Security.framework
      - sdk: libresolv.tbd
      - sdk: Speech.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(OPERATOR_BUNDLE_ID_PREFIX).ios
        SWIFT_OBJC_BRIDGING_HEADER: OperatorApp/Sources/runtime/embedded/EmbeddedNodeBridge.h
        LIBRARY_SEARCH_PATHS: ['$(inherited)', '$(SRCROOT)/build/native-whatsapp']
        # Simulator links the real Go bridge; device compiles the C stub
        # instead. Exactly one of the two supplies the Wacli* symbols, so they
        # never collide.
        "OTHER_LDFLAGS[sdk=iphonesimulator*]": ['$(inherited)', '-lWacliBridge']
        "EXCLUDED_SOURCE_FILE_NAMES[sdk=iphonesimulator*]": WacliBridgeUnavailable.c
        # Ad-hoc signing on the simulator needs an explicit application
        # identifier for Keychain APIs to work. On device, real provisioning
        # supplies it, and no code uses a keychain access group, so no device
        # entitlements file is required.
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": OperatorApp/Sources/runtime/embedded/signing/Simulator.entitlements
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        "CODE_SIGN_STYLE[sdk=iphoneos*]": Automatic
        "DEVELOPMENT_TEAM[sdk=iphoneos*]": $(OPERATOR_DEVELOPMENT_TEAM)
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        PRODUCT_MODULE_NAME: OperatorApp
        PRODUCT_NAME: Operator
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: OperatorApp/Info.plist
        SUPPORTS_MACCATALYST: NO
  OperatorWidget:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: OperatorWidget/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(OPERATOR_BUNDLE_ID_PREFIX).ios.widget
        "CODE_SIGN_STYLE[sdk=iphoneos*]": Automatic
        "DEVELOPMENT_TEAM[sdk=iphoneos*]": $(OPERATOR_DEVELOPMENT_TEAM)
        PRODUCT_MODULE_NAME: OperatorWidget
        PRODUCT_NAME: OperatorWidget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: OperatorWidget/Info.plist
  OperatorAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OperatorApp/Tests
    dependencies:
      - target: OperatorApp
      - package: OperatorCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
