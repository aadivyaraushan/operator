[versions]
agp = "9.2.1"
composeBom = "2026.06.01"
dataStore = "1.2.1"
junit = "4.13.2"
androidTestRunner = "1.7.0"
androidTestJunit = "1.3.0"
espresso = "3.7.0"
activityCompose = "1.13.0"
kotlin = "2.2.10"
okhttp = "5.4.0"
kotlinxSerialization = "1.11.0"
cameraX = "1.6.1"
lifecycle = "2.10.0"
zxing = "3.5.4"
tink = "1.23.0"
playServicesAuth = "21.6.0"
playServicesLocation = "21.4.0"
msal = "8.4.1"
moonshineVoice = "0.1.5"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-junit4-accessibility = { module = "androidx.compose.ui:ui-test-junit4-accessibility" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "dataStore" }
junit = { module = "junit:junit", version.ref = "junit" }
android-test-runner = { module = "androidx.test:runner", version.ref = "androidTestRunner" }
android-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidTestJunit" }
espresso-intents = { module = "androidx.test.espresso:espresso-intents", version.ref = "espresso" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
okhttp-tls = { module = "com.squareup.okhttp3:okhttp-tls", version.ref = "okhttp" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "cameraX" }
camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "cameraX" }
camera-view = { module = "androidx.camera:camera-view", version.ref = "cameraX" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
tink-android = { module = "com.google.crypto.tink:tink-android", version.ref = "tink" }
play-services-auth = { module = "com.google.android.gms:play-services-auth", version.ref = "playServicesAuth" }
play-services-location = { module = "com.google.android.gms:play-services-location", version.ref = "playServicesLocation" }
msal = { module = "com.microsoft.identity.client:msal", version.ref = "msal" }
moonshine-voice = { module = "ai.moonshine:moonshine-voice", version.ref = "moonshineVoice" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
